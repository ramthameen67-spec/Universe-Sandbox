['Jupiter-sized Earth',()=>{const r=solar(A4);Object.assign(r[3],{m:9.5e-4,r:.45});return r},2,'Earth with Jupiter mass/radius \u2014 how do orbits change?'],
['All planets crammed together',()=>{const r=solar(A8);r.slice(1).forEach((b,i)=>put(b,r[0],1+.09*i,i*.9));return r},3,'All 8 planets squeezed into the orbit of Earth'],
['Jupiter as a star',jup,3,'Jupiter ignites as a small red star'],
['Second Sun',()=>{const r=solar(A8),s=mkS('Second Sun',.5,'#ffb070');s.x=60;s.vz=.3;r.push(s);return r},2,'A second star passes through the Solar System']],
'Collisions & Catastrophes':[
['Asteroid Impact on Earth',impact,1,'A large asteroid on collision course with Earth'],
['Earth-Mars Collision',()=>{const r=solar(A4),e=r[3],m=r[4];m.x=e.x+.05;m.y=e.y;m.z=e.z;m.vx=e.vx-4;m.vy=e.vy;m.vz=e.vz;return r},1,'What if Mars collided with Earth?'],
['Planetary Collision',()=>hit('Theia',3.2e-7,3),1,'A Mars-sized world slams into Earth'],
['Stellar collision',()=>{const a=mkS('Star A',1,'#ffd98a'),b=mkS('Star B',1,'#ffb070');a.x=-3;b.x=3;return[a,b]},3,'Two stars on a collision course'],
['Black hole in the system',()=>{const r=solar(ALL.slice(0,5));r.push(put(mkH('Stellar BH',8),r[0],14,2));return r},2,'A stellar black hole invades the inner Solar System']],
'Lab & Exotic':[['Figure-eight orbit',eight,4,'Three equal stars chase each other in a figure eight'],['Binary star with planet',()=>{const r=pair(1,.8,.5);r.push(put(bd('Earth'),{...Z,m:1.8},2.2,1));return r},3,'An Earth-like world orbiting two stars'],['Planets around a black hole',()=>{const h=mkH('Supermassive BH',1000);return[h,...[3,5,8,12].map((a,i)=>put(bd(i%2?'Mars':'Earth',{n:'Planet '+(i+1)}),h,a,i*1.7))]},1,'Four worlds circle a supermassive black hole']]};
const dia=l=>{const bs=l.filter(b=>b.t!=='neb').slice(0,14),c=bs.reduce((a,b)=>b.m>a.m?b:a,bs[0]),o=bs.filter(b=>b!==c),mx=Math.max(1e-9,...o.map(b=>Math.hypot(b.x-c.x,b.z-c.z)));let h='<svg viewBox="0 0 60 60">';[12,20,28].forEach(r=>h+='<circle cx="30" cy="30" r="'+r+'" fill="none" stroke="rgba(160,180,255,.25)"/>');h+='<circle cx="30" cy="30" r="4.5" fill="'+(c.t==='hole'?'#05060f" stroke="#ff9d5c':c.c1)+'"/>';o.forEach((b,i)=>{const r=8+20*Math.sqrt(Math.hypot(b.x-c.x,b.z-c.z)/mx),a=i*1.9;h+='<circle cx="'+(30+r*Math.cos(a)).toFixed(1)+'" cy="'+(30+r*Math.sin(a)).toFixed(1)+'" r="2.6" fill="'+b.c1+'"/>'});return h+'</svg>'};
let sk='Real Cosmos';
function scenes(){modal('Scenes',p=>{p.parentNode.classList.add('w');const bar=E('button','l',''),g=E('div'),show=()=>{g.innerHTML='';p.parentNode.scrollTop=0;bar.textContent=sk+' \u203a';SCN[sk].forEach(s=>{const b=E('button','l cd');b.innerHTML=dia(s[1]())+'<span><b>'+s[0]+'</b><small>'+(s[3]||'')+'</small></span>';b.onclick=()=>{loadScene(s[1](),s[2]);ev=s[4]?{at:s[4][0],fn:s[4][1]}:null;close()};g.append(b)})};
bar.onclick=()=>{g.innerHTML='';bar.textContent='Choose a collection';Object.keys(SCN).forEach(k=>g.append(E('button','l',k+' ('+SCN[k].length+')',()=>{sk=k;show()})))};p.append(bar,g);show()})}
function objList(){modal('Objects in this scene',p=>{const i=E('input'),l=E('div');i.type='text';i.placeholder='Search by name';p.append(i,l);const f=()=>{l.innerHTML='';B.filter(b=>b.n.toLowerCase().includes(i.value.toLowerCase())).forEach(b=>l.append(E('button','l',b.n,()=>{close();focus(b)})))};i.oninput=f;f()})}
const HELP=['Drag to rotate, pinch or scroll to zoom, tap an object to select and follow it.','Add places an object near the view center and puts it in orbit. Auto orbit resets an object to a circular orbit. Add a star next to another star (or a planet next to a planet of the same kind) to make a binary pair, or use Binary orbit in the Orbit tab.','Laser: tap objects to remove them. Move bodies: drag objects around. Collisions merge objects; a body above 0.07 Suns ignites as a star.','Select an object: Edit changes mass, radius, spin and tilt. Orbit has Move, Heat with laser, Stop and Explode.','Use the \u00ab and \u00bb buttons to change the time speed.'];
const gfx=()=>{rd.setPixelRatio(Math.min(devicePixelRatio||1,[1,1.5,2][opt.gfx]));sky.userData.px.value=rd.getPixelRatio();rs()};
let stab='General';
function settings(tb){if(typeof tb==='string')stab=tb;modal('Settings',p=>{const tabs=E('div','tabs'),body=E('div');['General','Physics','Help'].forEach(k=>tabs.append(E('button',stab===k?'on':'',k,()=>settings(k))));p.append(tabs,body);
const sr=(l,get,tap)=>{const b=E('button','l sr'),v=E('b');b.append(E('span','',l),v);const u=()=>v.textContent=get();u();b.onclick=()=>{tap();u()};body.append(b)},
on=k=>()=>opt[k]?'On':'Off',tg=k=>()=>{opt[k]=opt[k]?0:1},
sl=(l,k,lo,hi,st,fm)=>{const r=E('div','row'),v=E('b'),i=E('input');r.append(E('span','',l),v);i.type='range';i.min=lo;i.max=hi;i.step=st;i.value=opt[k];v.textContent=fm(opt[k]);i.oninput=()=>{opt[k]=+i.value;v.textContent=fm(opt[k])};body.append(r,i)};
if(stab==='General'){sr('Sound',on('snd'),tg('snd'));sr('Graphics',()=>['Low','Medium','High'][opt.gfx]+' \u203a',()=>{opt.gfx=(opt.gfx+1)%3;gfx()});sr('Object labels',()=>['None','Important','All'][opt.labels]+' \u203a',()=>{opt.labels=(opt.labels+1)%3});sr('Trajectories',()=>(opt.orbits?'Orbits':'Off')+' \u203a',tg('orbits'));const cr=E('div','row'),cl=E('span','','Orbital line colour'),ci=E('input');ci.type='color';ci.value=orbitLineColor;ci.title='Choose orbital line colour';ci.style.cssText='width:58px;height:34px;padding:2px;background:#151923;border:1px solid #39445a;border-radius:8px';ci.oninput=()=>{orbitLineColor=ci.value;B.forEach(o=>{if(o.ln)o.ln.material.color.set(orbitLineColor)});try{localStorage.setItem('usb3-orbit-line-color',orbitLineColor)}catch(e){}};cr.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px';cr.append(cl,ci);body.append(cr);sr('Grid',on('grid'),()=>{opt.grid=opt.grid?0:1;if(grid)grid.visible=!!opt.grid});sr('Gravity Lines',on('gl'),tg('gl'))}
else if(stab==='Physics'){sr('Collisions',on('coll'),tg('coll'));sr('Roche Limit',on('roche'),tg('roche'));sl('Gravity Multiplier','gm',0,3,.1,x=>x.toFixed(1)+'\u00d7');sl('Simulation Quality','sq',.5,2,.5,x=>x.toFixed(1)+'\u00d7');body.append(E('div','row','Higher = more accurate orbits at high time speeds, lower FPS'));sr('Thermal Dynamics',on('therm'),tg('therm'));sr('Stellar Evolution',on('evo'),tg('evo'))}
else HELP.forEach(t=>body.append(E('div','row',t)))})}
function help(){settings('Help')}
function achs(){modal('Achievements',p=>['first_planet','first_star','first_blackhole','first_collision','five_collisions','ten_bodies','auto_orbit'].forEach(id=>row(p,id.replace(/_/g,' '),()=>done.has(id)?'\u2713 unlocked':'locked')),live.forEach(f=>f()))}

function saveM(){modal('Save',p=>p.append(E('button','l','Save this scene',()=>{try{localStorage.setItem('usb3-save',JSON.stringify({t,b:B.map(b=>Object.fromEntries(KS.map(k=>[k,b[k]])))}));toast('Scene saved')}catch(e){toast('Saving is blocked in this browser')}close()}),E('button','l','Load saved scene',()=>{try{const s=JSON.parse(localStorage.getItem('usb3-save'));loadScene(s.b);t=s.t}catch(e){toast('No saved scene yet')}close()})))}

const APEX_KEY='',APEX_MODELS=['gemini-3.1-flash-lite','gemini-3.5-flash-lite','gemini-3.8-flash','gemini-2.5-flash','gemini-2.0-flash'],
APEX_PROMPT=`You design solar systems for a physics sandbox. Reply with ONE JSON object and nothing else.
Format: {"name":string,"description":string,"bodies":[...]}
Each body: {"name":string,"kind":string,"parent":null|string|[string,string],"a_au":number,"ecc":0-0.9,"inc_deg":number,"phase_deg":0-360,"mass_solar":number (stars, brown dwarfs, white dwarfs, neutron stars, black holes only),"mass_earth":number (everything else)}
Optional per body: "color1":"#rrggbb","color2":"#rrggbb","water":0-1 (earthlike only),"rings":true,"magnetic_field":number (1 = Earth, 0 = none, Jupiter 14; planets and moons only),"atmosphere":0-10 (1 = Earth, 0 = airless),"tilt_deg":0-180,"luminosity_solar":number,"size":"giant"|"supergiant" (stars only).
kind is one of: star, brown_dwarf, white_dwarf, neutron_star, black_hole, rocky, earthlike, ocean, desert, lava, ice_world, ice_giant, gas_giant, dwarf_planet, moon, asteroid, comet.
Rules:
- The first body is the main star (parent null). Every other body has a parent and a_au is its distance from that parent in AU.
- A companion star uses the main star as parent with a_au as the separation. Planets that orbit both stars of a binary use "parent":["StarA","StarB"] and a_au at least 3.5 times the star separation.
- Moons use their planet as parent. Use a tiny a_au (Earth's Moon is 0.00257) that stays well inside the planet's Hill sphere. Planets must be spaced sensibly and stay outside their star (the Sun's radius is 0.00465 AU).
- Use realistic masses: Earth = 1 mass_earth, Neptune 17, Jupiter 318, Sun = 1 mass_solar, red dwarf 0.1-0.5, brown dwarf 0.013-0.08, white dwarf 0.5-1.3, neutron star 1.4.
- Star colors: red #ff8a5c, orange #ffb060, yellow #ffd98a, white #fff4d8, blue-white #9cc4ff. Give giants and rocky planets color1 and color2 that match how they should look.
- Use at most 40 bodies. If the request is unusual, build the closest valid system.`;
const apexStored=()=>{try{return localStorage.getItem('apex-key')||''}catch(e){return''}},apexKey=()=>apexStored()||APEX_KEY;
function apexErr(status,data){const msg=(data&&data.error&&data.error.message)||'',lo=msg.toLowerCase(),e=new Error();
if(/leak/.test(lo)){e.message='Google switched this key off because it was posted publicly. Make a new key and paste it below.';e.key=1}
else if(status===400&&/api[ _]?key/.test(lo)){e.message='Google says this API key is not valid. Paste a working key below.';e.key=1}
else if(status===401||status===403){e.message='Google refused this key ('+status+'). '+(msg?msg.slice(0,150):'Check that it is allowed to use the Gemini API.');e.key=1}
